<h2 class="text-[1.35rem] font-semibold mb-2">
  {{ title }}
</h2>

@if (subtitle) {
  <p class="text-sm text-muted mb-8 max-w-[52ch]">
    {{ subtitle }}
  </p>
}

<ol class="flex flex-col">
  @for (step of steps; track step.title; let i = $index; let isLast = $last) {
    <li class="relative flex gap-4 pb-8 last:pb-0">
      <!-- Connector between markers; hidden on the last step so the line stops cleanly. -->
      @if (!isLast) {
        <span
          class="absolute left-[1.0625rem] top-9 bottom-0 w-px bg-muted/40"
          aria-hidden="true"
        ></span>
      }

      <span
        class="relative z-10 flex h-[2.125rem] w-[2.125rem] shrink-0 items-center justify-center rounded-full border border-primary bg-background text-sm font-semibold text-primary"
        aria-hidden="true"
      >
        {{ i + 1 }}
      </span>

      <div class="flex flex-col gap-1 pt-1">
        <h3 class="text-sm font-semibold uppercase tracking-[0.12em]">
          {{ step.title }}
        </h3>
        <p class="text-sm text-muted max-w-[60ch]">
          {{ step.description }}
        </p>
      </div>
    </li>
  }
</ol>
